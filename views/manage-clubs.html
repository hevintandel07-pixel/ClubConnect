<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Clubs - ClubConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

    <style>
        body {
            background: #f4f7fc;
            color: #202b3c;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0d1b3d !important;
            padding: 14px 0;
        }

        .navbar-brand {
            color: white !important;
            font-size: 23px;
            font-weight: 800;
        }

        .navbar .nav-link {
            color: #e8efff !important;
            font-weight: 600;
        }

        .navbar .nav-link:hover {
            color: #9fc5ff !important;
        }

        .page-header {
            background: linear-gradient(120deg, #0d1b3d, #174ea6);
            padding: 36px 0;
            color: white;
        }

        .page-header h1 {
            color: white;
            font-weight: 800;
        }

        .page-header p {
            color: #e4edff;
        }

        .panel {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 5px 18px rgba(13, 27, 61, .05);
        }

        h2 {
            color: #0d1b3d;
            font-weight: 750;
        }

        .form-control,
        .form-select {
            min-height: 44px;
            border-radius: 8px;
        }

        .btn {
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-primary {
            background: #174ea6 !important;
            border-color: #174ea6 !important;
        }

        .table thead th {
            background: #eaf2ff;
            color: #0d1b3d;
            white-space: nowrap;
        }

        footer {
            background: #0d1b3d;
            color: white;
            padding: 20px 0;
            margin-top: 35px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="/index.html">
            <i class="bi bi-people-fill me-2"></i>ClubConnect
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" href="/index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/clubs.html">Clubs</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/events.html">Events</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin-dashboard.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <button id="logoutBtn"
                            class="btn btn-outline-light btn-sm ms-lg-2 mt-2 mt-lg-0">
                        Logout
                    </button>
                </li>

            </ul>
        </div>
    </div>
</nav>

<header class="page-header">
    <div class="container">
        <h1 class="h2">Manage Clubs</h1>
        <p class="mb-0">Create, update and manage college clubs.</p>
    </div>
</header>

<main class="container py-4">

    <div id="message" class="alert d-none" role="alert"></div>

    <section class="panel mb-4">

        <h2 class="h4 mb-3" id="formTitle">Add New Club</h2>

        <form id="clubForm">
            <input type="hidden" id="clubId">

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="clubName" class="form-label">
                        Club Name *
                    </label>

                    <input id="clubName"
                           class="form-control"
                           required
                           maxlength="100"
                           placeholder="Enter club name">
                </div>

                <div class="col-md-6">
                    <label for="category" class="form-label">
                        Category *
                    </label>

                    <select id="category" class="form-select" required>
                        <option value="">Select category</option>
                        <option value="Technical">Technical</option>
                        <option value="Cultural">Cultural</option>
                        <option value="Sports">Sports</option>
                        <option value="Literary">Literary</option>
                        <option value="Social">Social</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="description" class="form-label">
                        Description *
                    </label>

                    <textarea id="description"
                              class="form-control"
                              rows="3"
                              required
                              maxlength="2000"
                              placeholder="Describe the club"></textarea>
                </div>

                <div class="col-md-6">
                    <label for="coordinator" class="form-label">
                        Coordinator
                    </label>

                    <input id="coordinator"
                           class="form-control"
                           maxlength="100"
                           placeholder="Coordinator name">
                </div>

                <div class="col-md-6">
                    <label for="image" class="form-label">
                        Image URL
                    </label>

                    <input id="image"
                           type="url"
                           class="form-control"
                           placeholder="https://example.com/image.jpg">
                </div>

                <div class="col-12 d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary" id="saveBtn">
                        <i class="bi bi-plus-circle me-1"></i>Save Club
                    </button>

                    <button type="button"
                            class="btn btn-outline-secondary d-none"
                            id="cancelBtn">
                        Cancel Edit
                    </button>
                </div>

            </div>
        </form>
    </section>

    <section class="panel">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h4 mb-0">All Clubs</h2>

            <input id="searchInput"
                   type="search"
                   class="form-control"
                   style="max-width:300px"
                   placeholder="Search clubs...">
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">

                <thead>
                    <tr>
                        <th>Club</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Coordinator</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="clubsTable">
                    <tr>
                        <td colspan="5" class="text-center py-4">
                            Loading clubs...
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>
    </section>

</main>

<footer class="text-center">
    <div class="container">
        <small>&copy; 2026 ClubConnect. All Rights Reserved.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
"use strict";

const token =
    localStorage.getItem("authToken") ||
    localStorage.getItem("token") ||
    localStorage.getItem("accessToken");

let clubs = [];

const table = document.getElementById("clubsTable");
const message = document.getElementById("message");
const form = document.getElementById("clubForm");

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function showMessage(text, type = "danger") {
    message.textContent = text;
    message.className = "alert alert-" + type;
}

function authHeaders(json = true) {
    const headers = {
        Authorization: "Bearer " + token
    };

    if (json) {
        headers["Content-Type"] = "application/json";
    }

    return headers;
}

async function apiRequest(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json().catch(() => ({}));

    if (response.status === 401 || response.status === 403) {
        showMessage(
            "Your session may have expired or you do not have permission.",
            "danger"
        );

        throw new Error(
            data.message || "Authentication or authorization failed."
        );
    }

    if (!response.ok) {
        throw new Error(data.message || "Request failed.");
    }

    return data;
}

function resetForm() {
    form.reset();

    document.getElementById("clubId").value = "";
    document.getElementById("formTitle").textContent = "Add New Club";

    document.getElementById("saveBtn").innerHTML =
        '<i class="bi bi-plus-circle me-1"></i>Save Club';

    document.getElementById("cancelBtn").classList.add("d-none");
}

function renderClubs() {
    const query = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    const filtered = clubs.filter(club =>
        [
            club.clubName,
            club.name,
            club.category,
            club.description,
            club.coordinator
        ].join(" ").toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="5" class="text-center py-4">
                    No clubs found.
                </td>
            </tr>
        `;
        return;
    }

    table.innerHTML = filtered.map(club => {
        const id = club._id || club.id;

        return `
            <tr>
                <td class="fw-semibold">
                    ${escapeHTML(club.clubName || club.name || "Unnamed Club")}
                </td>

                <td>${escapeHTML(club.category || "—")}</td>

                <td>${escapeHTML(club.description || "—")}</td>

                <td>${escapeHTML(club.coordinator || "—")}</td>

                <td class="text-nowrap">
                    <button
                        class="btn btn-sm btn-outline-primary me-1"
                        data-action="edit"
                        data-id="${escapeHTML(id)}">
                        Edit
                    </button>

                    <button
                        class="btn btn-sm btn-outline-danger"
                        data-action="delete"
                        data-id="${escapeHTML(id)}">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    }).join("");
}

async function loadClubs() {
    table.innerHTML = `
        <tr>
            <td colspan="5" class="text-center py-4">
                Loading clubs...
            </td>
        </tr>
    `;

    try {
        const data = await apiRequest("/api/clubs", {
            method: "GET",
            headers: authHeaders(false)
        });

        clubs = Array.isArray(data)
            ? data
            : (data.clubs || data.data || []);

        if (!Array.isArray(clubs)) {
            clubs = [];
        }

        renderClubs();

    } catch (error) {
        console.error("Load clubs error:", error);

        table.innerHTML = `
            <tr>
                <td colspan="5" class="text-center text-danger py-4">
                    Unable to load clubs. Please check the server and API route.
                </td>
            </tr>
        `;

        showMessage(error.message || "Unable to load clubs.");
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = document.getElementById("clubId").value;

    const payload = {
        clubName: document.getElementById("clubName").value.trim(),
        category: document.getElementById("category").value,
        description: document.getElementById("description").value.trim(),
        coordinator: document.getElementById("coordinator").value.trim(),
        image: document.getElementById("image").value.trim()
    };

    if (!payload.clubName || !payload.category || !payload.description) {
        showMessage("Please fill in all required fields.");
        return;
    }

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;

    try {
        const url = id
            ? `/api/clubs/${encodeURIComponent(id)}`
            : "/api/clubs";

        const method = id ? "PUT" : "POST";

        const data = await apiRequest(url, {
            method,
            headers: authHeaders(),
            body: JSON.stringify(payload)
        });

        showMessage(
            data.message ||
            (id
                ? "Club updated successfully."
                : "Club created successfully."),
            "success"
        );

        resetForm();
        await loadClubs();

    } catch (error) {
        console.error("Save club error:", error);
        showMessage(error.message || "Unable to save club.");

    } finally {
        saveBtn.disabled = false;
    }
});

table.addEventListener("click", async function(event) {
    const button = event.target.closest("button[data-action]");

    if (!button) return;

    const club = clubs.find(item =>
        String(item._id || item.id) === button.dataset.id
    );

    if (!club) {
        showMessage("Club not found. Please refresh the list.");
        return;
    }

    if (button.dataset.action === "edit") {
        document.getElementById("clubId").value =
            club._id || club.id;

        document.getElementById("clubName").value =
            club.clubName || club.name || "";

        document.getElementById("category").value =
            club.category || "";

        document.getElementById("description").value =
            club.description || "";

        document.getElementById("coordinator").value =
            club.coordinator || "";

        document.getElementById("image").value =
            club.image || club.imageUrl || "";

        document.getElementById("formTitle").textContent = "Edit Club";

        document.getElementById("saveBtn").innerHTML =
            '<i class="bi bi-check-circle me-1"></i>Update Club';

        document.getElementById("cancelBtn").classList.remove("d-none");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        return;
    }

    if (button.dataset.action === "delete") {
        const clubName = club.clubName || club.name || "this club";

        if (!confirm(
            `Delete "${clubName}"? This action cannot be undone.`
        )) {
            return;
        }

        button.disabled = true;

        try {
            const data = await apiRequest(
                `/api/clubs/${encodeURIComponent(button.dataset.id)}`,
                {
                    method: "DELETE",
                    headers: authHeaders(false)
                }
            );

            showMessage(
                data.message || "Club deleted successfully.",
                "success"
            );

            if (
                document.getElementById("clubId").value === button.dataset.id
            ) {
                resetForm();
            }

            await loadClubs();

        } catch (error) {
            console.error("Delete club error:", error);

            showMessage(error.message || "Unable to delete club.");
            button.disabled = false;
        }
    }
});

document.getElementById("cancelBtn")
    .addEventListener("click", resetForm);

document.getElementById("searchInput")
    .addEventListener("input", renderClubs);

document.getElementById("logoutBtn").addEventListener("click", function() {
    [
        "authToken",
        "token",
        "accessToken",
        "loggedInUser",
        "user",
        "currentUser"
    ].forEach(key => localStorage.removeItem(key));

    window.location.replace("/index.html");
});

function checkAdminAccess() {
    let currentUser;

    try {
        currentUser = JSON.parse(
            localStorage.getItem("loggedInUser") || "null"
        );
    } catch (error) {
        currentUser = null;
    }

    if (!token || !currentUser || currentUser.role !== "admin") {
        window.location.replace("/admin-login.html");
        return false;
    }

    return true;
}

if (checkAdminAccess()) {
    loadClubs();
}
</script>

</body>
</html>
