<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Events - ClubConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .page-title {
            font-weight: 700;
        }

        .event-card {
            border: none;
            border-radius: 16px;
            transition: 0.2s;
        }

        .event-card:hover {
            transform: translateY(-3px);
        }

        .event-image {
            height: 190px;
            width: 100%;
            object-fit: cover;
        }

        .event-description {
            min-height: 25px;
        }

        .seat-badge {
            font-size: 13px;
        }

    </style>

</head>

<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/admin-dashboard.html">

            ClubConnect Admin

        </a>


        <button
            class="btn btn-outline-light"
            onclick="goDashboard()">

            Dashboard

        </button>

    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="container py-4">


    <!-- HEADER -->

    <div
        class="d-flex
               justify-content-between
               align-items-center
               flex-wrap
               gap-2
               mb-4">

        <div>

            <h2 class="page-title mb-1">
                Manage Events
            </h2>

            <p class="text-muted mb-0">
                Add, edit, delete and manage college events.
            </p>

        </div>


        <div class="d-flex gap-2 flex-wrap">

            <button
                class="btn btn-success"
                onclick="exportEvents()">

                📊 Export Excel

            </button>


            <button
                class="btn btn-primary"
                onclick="openAddModal()">

                + Add Event

            </button>

        </div>

    </div>


    <!-- ALERT -->

    <div
        id="alertBox"
        class="alert d-none"
        role="alert">
    </div>


    <!-- EVENTS -->

    <div
        id="eventsContainer"
        class="row g-4">

    </div>

</div>


<!-- =====================================================
     ADD / EDIT EVENT MODAL
===================================================== -->

<div
    class="modal fade"
    id="eventModal"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Add Event

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <form id="eventForm">


                    <input
                        type="hidden"
                        id="eventId">


                    <!-- TITLE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Event Title
                        </label>

                        <input
                            type="text"
                            id="eventTitle"
                            class="form-control"
                            placeholder="Enter event title"
                            required>

                    </div>


                    <!-- CLUB -->

                    <div class="mb-3">

                        <label class="form-label">
                            Club Name
                        </label>

                        <select
                            id="eventClub"
                            class="form-select"
                            required>

                            <option value="">
                                Select Club
                            </option>

                        </select>

                    </div>


                    <!-- DATE + TIME -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                id="eventDate"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Time
                            </label>

                            <input
                                type="time"
                                id="eventTime"
                                class="form-control"
                                required>

                        </div>

                    </div>


                    <!-- VENUE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Venue
                        </label>

                        <input
                            type="text"
                            id="eventVenue"
                            class="form-control"
                            placeholder="Enter event venue"
                            required>

                    </div>


                    <!-- SEATS -->

                    <div class="mb-3">

                        <label class="form-label">
                            Total Seats
                        </label>

                        <input
                            type="number"
                            id="eventSeats"
                            class="form-control"
                            min="1"
                            placeholder="Enter total seats"
                            required>

                    </div>


                    <!-- IMAGE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Image URL
                        </label>

                        <input
                            type="text"
                            id="eventImage"
                            class="form-control"
                            placeholder="Optional image URL">

                    </div>


                </form>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="saveEvent()">

                    Save Event

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     DELETE MODAL
===================================================== -->

<div
    class="modal fade"
    id="deleteModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    Delete Event
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <p class="mb-0">

                    Are you sure you want to delete this event?

                    <br>

                    <strong>
                        All registrations for this event will also be removed.
                    </strong>

                </p>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="confirmDelete()">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

// =====================================================
// VARIABLES
// =====================================================

let events = [];

let clubs = [];

let selectedDeleteId = null;

let eventModal;

let deleteModal;


// =====================================================
// PAGE LOAD
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        eventModal =
            new bootstrap.Modal(
                document.getElementById(
                    "eventModal"
                )
            );


        deleteModal =
            new bootstrap.Modal(
                document.getElementById(
                    "deleteModal"
                )
            );


        await loadClubs();

        await loadEvents();

    }
);


// =====================================================
// LOAD CLUBS
// =====================================================

async function loadClubs() {

    try {

        const response =
            await fetch("/api/clubs");


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load clubs."
            );

        }


        clubs =
            data.clubs || [];


        populateClubDropdown();

    }

    catch (error) {

        console.log(
            "Load Clubs Error:",
            error
        );

    }

}


// =====================================================
// CLUB DROPDOWN
// =====================================================

function populateClubDropdown(
    selectedValue = ""
) {

    const select =
        document.getElementById(
            "eventClub"
        );


    select.innerHTML = `

        <option value="">
            Select Club
        </option>

        ${clubs.map(club => `

            <option
                value="${escapeHtml(club.name)}"
                ${club.name === selectedValue
                    ? "selected"
                    : ""}>

                ${escapeHtml(club.name)}

            </option>

        `).join("")}

    `;

}


// =====================================================
// LOAD EVENTS
// =====================================================

async function loadEvents() {

    const container =
        document.getElementById(
            "eventsContainer"
        );


    container.innerHTML = `

        <div class="col-12 text-center py-5">

            <div
                class="spinner-border text-primary">
            </div>

            <p class="text-muted mt-2">
                Loading events...
            </p>

        </div>

    `;


    try {

        const response =
            await fetch(
                "/api/events"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load events."
            );

        }


        events =
            data.events || [];


        renderEvents();

    }

    catch (error) {

        showAlert(
            error.message,
            "danger"
        );


        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-danger">

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            </div>

        `;

    }

}


// =====================================================
// RENDER EVENTS
// =====================================================

function renderEvents() {

    const container =
        document.getElementById(
            "eventsContainer"
        );


    if (events.length === 0) {

        container.innerHTML = `

            <div class="col-12">

                <div
                    class="card
                           shadow-sm
                           p-5
                           text-center">

                    <h4>
                        No Events Found
                    </h4>

                    <p class="text-muted mb-0">

                        Click "Add Event"
                        to create your first event.

                    </p>

                </div>

            </div>

        `;

        return;

    }


    container.innerHTML =
        events.map(event => {


            const image =
                event.image ||
                "../public/images/coding-event.png";


            const date =
                event.date
                    ? new Date(
                        event.date
                    ).toLocaleDateString(
                        "en-IN",
                        {
                            day: "2-digit",
                            month: "short",
                            year: "numeric"
                        }
                    )
                    : "";


            const available =
                Number(
                    event.availableSeats
                );


            const total =
                Number(
                    event.totalSeats
                );


            let seatClass =
                "bg-success";


            if (
                available === 0
            ) {

                seatClass =
                    "bg-danger";

            }

            else if (
                available <=
                Math.ceil(total * 0.25)
            ) {

                seatClass =
                    "bg-warning text-dark";

            }


            return `

                <div class="col-md-6 col-lg-4">

                    <div
                        class="card
                               event-card
                               shadow-sm
                               h-100">


                        <img
                            src="${escapeAttribute(image)}"
                            class="event-image"
                            alt="${escapeAttribute(event.title)}"
                            onerror="this.src='../public/images/coding-event.png'">


                        <div
                            class="card-body
                                   d-flex
                                   flex-column">


                            <h5 class="fw-bold mb-2">

                                ${escapeHtml(
                                    event.title
                                )}

                            </h5>


                            <p class="text-primary mb-2">

                                🏛️
                                ${escapeHtml(
                                    event.clubName
                                )}

                            </p>


                            <p class="mb-1">

                                📅
                                ${date}

                            </p>


                            <p class="mb-1">

                                ⏰
                                ${escapeHtml(
                                    event.time
                                )}

                            </p>


                            <p class="mb-3">

                                📍
                                ${escapeHtml(
                                    event.venue
                                )}

                            </p>


                            <span
                                class="badge
                                       ${seatClass}
                                       seat-badge
                                       align-self-start
                                       mb-3">

                                Seats:
                                ${available}
                                /
                                ${total}

                            </span>


                            <div
                                class="mt-auto
                                       d-flex
                                       gap-2">


                                <button
                                    class="btn
                                           btn-outline-primary
                                           btn-sm
                                           flex-fill"
                                    onclick="openEditModal('${event._id}')">

                                    Edit

                                </button>


                                <button
                                    class="btn
                                           btn-outline-danger
                                           btn-sm
                                           flex-fill"
                                    onclick="openDeleteModal('${event._id}')">

                                    Delete

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


// =====================================================
// OPEN ADD MODAL
// =====================================================

function openAddModal() {

    document
        .getElementById(
            "eventForm"
        )
        .reset();


    document
        .getElementById(
            "eventId"
        )
        .value = "";


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "Add Event";


    populateClubDropdown();


    eventModal.show();

}


// =====================================================
// OPEN EDIT MODAL
// =====================================================

function openEditModal(id) {

    const event =
        events.find(
            item =>
                item._id === id
        );


    if (!event) {

        showAlert(
            "Event not found.",
            "danger"
        );

        return;

    }


    document
        .getElementById(
            "eventId"
        )
        .value =
        event._id;


    document
        .getElementById(
            "eventTitle"
        )
        .value =
        event.title;


    populateClubDropdown(
        event.clubName
    );


    document
        .getElementById(
            "eventDate"
        )
        .value =
        formatDateForInput(
            event.date
        );


    document
        .getElementById(
            "eventTime"
        )
        .value =
        event.time;


    document
        .getElementById(
            "eventVenue"
        )
        .value =
        event.venue;


    document
        .getElementById(
            "eventSeats"
        )
        .value =
        event.totalSeats;


    document
        .getElementById(
            "eventImage"
        )
        .value =
        event.image || "";


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "Edit Event";


    eventModal.show();

}


// =====================================================
// SAVE EVENT
// =====================================================

async function saveEvent() {

    const id =
        document.getElementById(
            "eventId"
        ).value;


    const title =
        document.getElementById(
            "eventTitle"
        ).value.trim();


    const clubName =
        document.getElementById(
            "eventClub"
        ).value;


    const date =
        document.getElementById(
            "eventDate"
        ).value;


    const time =
        document.getElementById(
            "eventTime"
        ).value;


    const venue =
        document.getElementById(
            "eventVenue"
        ).value.trim();


    const totalSeats =
        Number(
            document.getElementById(
                "eventSeats"
            ).value
        );


    const image =
        document.getElementById(
            "eventImage"
        ).value.trim();


    if (
        !title ||
        !clubName ||
        !date ||
        !time ||
        !venue ||
        !Number.isInteger(totalSeats) ||
        totalSeats < 1
    ) {

        showAlert(
            "Please fill all required fields correctly.",
            "warning"
        );

        return;

    }


    const payload = {

        title,

        clubName,

        date,

        time,

        venue,

        totalSeats,

        image

    };


    try {

        const response =
            await fetch(

                id
                    ? `/api/events/${id}`
                    : "/api/events",

                {

                    method:
                        id
                            ? "PUT"
                            : "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to save event."
            );

        }


        eventModal.hide();


        showAlert(
            data.message ||
            "Event saved successfully!",
            "success"
        );


        await loadEvents();

    }

    catch (error) {

        showAlert(
            error.message,
            "danger"
        );

    }

}


// =====================================================
// OPEN DELETE MODAL
// =====================================================

function openDeleteModal(id) {

    selectedDeleteId = id;

    deleteModal.show();

}


// =====================================================
// CONFIRM DELETE
// =====================================================

async function confirmDelete() {

    if (!selectedDeleteId) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/events/${selectedDeleteId}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to delete event."
            );

        }


        deleteModal.hide();


        selectedDeleteId = null;


        showAlert(
            data.message ||
            "Event deleted successfully!",
            "success"
        );


        await loadEvents();

    }

    catch (error) {

        showAlert(
            error.message,
            "danger"
        );

    }

}


// =====================================================
// EXPORT EVENTS
// =====================================================

function exportEvents() {

    window.location.href =
        "/api/export/events";

}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDateForInput(
    date
) {

    if (!date) {

        return "";

    }


    const d =
        new Date(date);


    const year =
        d.getFullYear();


    const month =
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;

}


// =====================================================
// ALERT
// =====================================================

function showAlert(
    message,
    type
) {

    const alertBox =
        document.getElementById(
            "alertBox"
        );


    alertBox.className =
        `alert alert-${type}`;


    alertBox.textContent =
        message;


    alertBox.classList.remove(
        "d-none"
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });


    setTimeout(
        function () {

            alertBox.classList.add(
                "d-none"
            );

        },
        4000
    );

}


// =====================================================
// DASHBOARD
// =====================================================

function goDashboard() {

    window.location.href =
        "/admin-dashboard.html";

}


// =====================================================
// SECURITY HELPERS
// =====================================================

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function (char) {

                const entities = {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"

                };

                return entities[char];

            }
        );

}


function escapeAttribute(value) {

    return escapeHtml(value);

}

</script>

</body>

</html>
