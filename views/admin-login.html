<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ClubConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        body {
            min-height: 100vh;
            background: #f4f7fc;
            color: #202b3c;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #0d1b3d !important;
            padding: 14px 0;
            box-shadow: 0 3px 14px rgba(13, 27, 61, .12);
        }

        .navbar-brand {
            color: #fff !important;
            font-size: 23px;
            font-weight: 800;
        }

        .navbar .nav-link {
            color: #e8efff !important;
            font-weight: 600;
            margin: 0 4px;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #9fc5ff !important;
        }

        .btn-admin {
            background: #174ea6;
            color: #fff !important;
            border: 1px solid #174ea6;
            border-radius: 7px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: .2s;
        }

        .btn-admin:hover {
            background: #103777;
            border-color: #103777;
        }

        .btn-register {
            background: #fff;
            color: #174ea6 !important;
            border: 1px solid #fff;
            border-radius: 7px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .btn-register:hover {
            background: #eaf2ff;
        }

        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 36px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(13, 27, 61, .09);
        }

        .login-icon {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #eaf2ff;
            color: #174ea6;
            font-size: 32px;
        }

        .login-card h1 {
            color: #0d1b3d;
            font-weight: 800;
        }

        .login-subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 26px;
        }

        .form-label {
            font-weight: 600;
            color: #202b3c;
        }

        .form-control {
            min-height: 46px;
            border-radius: 9px;
            border: 1px solid #cbd5e1;
        }

        .form-control:focus {
            border-color: #174ea6;
            box-shadow: 0 0 0 3px rgba(23, 78, 166, .12);
        }

        .input-group .form-control {
            border-radius: 9px 0 0 9px;
        }

        .input-group .btn {
            border-radius: 0 9px 9px 0;
        }

        .login-btn {
            width: 100%;
            min-height: 47px;
            margin-top: 8px;
            background: #174ea6;
            color: #fff;
            border: none;
            border-radius: 9px;
            font-weight: 700;
            transition: .2s;
        }

        .login-btn:hover {
            background: #103777;
            color: #fff;
        }

        .login-btn:disabled {
            opacity: .7;
        }

        .login-links a {
            color: #174ea6;
            text-decoration: none;
            font-weight: 600;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        footer {
            background: #0d1b3d;
            color: #fff;
            padding: 18px 0;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/index.html">
            <i class="bi bi-people-fill me-2"></i>ClubConnect
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="/index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/clubs.html">Clubs</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/events.html">Events</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/login.html?role=student">Student Login</a>
                </li>

                <li class="nav-item">
                    <a class="btn-admin ms-lg-2 mt-2 mt-lg-0 d-inline-block"
                       href="/admin-login.html">
                        <i class="bi bi-shield-lock me-1"></i>Admin Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="btn-register ms-lg-2 mt-2 mt-lg-0 d-inline-block"
                       href="/register.html">Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="login-main">
    <section class="login-card">

        <div class="login-icon">
            <i class="bi bi-shield-lock"></i>
        </div>

        <h1 class="h3 text-center mb-2">Admin Login</h1>

        <p class="login-subtitle">
            Sign in to manage ClubConnect
        </p>

        <div id="message"
             class="alert d-none"
             role="alert"
             aria-live="polite"></div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Admin Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter admin email"
                       autocomplete="username"
                       required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>

                <div class="input-group">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter admin password"
                           autocomplete="current-password"
                           required>

                    <button class="btn btn-outline-secondary"
                            type="button"
                            id="togglePassword"
                            aria-label="Show password">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn login-btn">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login as Admin
            </button>
        </form>

        <div class="login-links text-center mt-4">
            <p class="mb-2">
                Are you a student?
                <a href="/login.html?role=student">Student Login</a>
            </p>

            <p class="mb-0">
                <a href="/index.html">
                    <i class="bi bi-arrow-left me-1"></i>Back to Home
                </a>
            </p>
        </div>

    </section>
</main>

<footer class="text-center">
    <div class="container">
        <small>&copy; 2026 ClubConnect. All Rights Reserved.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
"use strict";

const form = document.getElementById("adminLoginForm");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const eyeIcon = document.getElementById("eyeIcon");

function showMessage(text, type = "danger") {
    message.textContent = text;
    message.className = `alert alert-${type}`;
    message.classList.remove("d-none");
}

togglePassword.addEventListener("click", function () {
    const showPassword = passwordInput.type === "password";

    passwordInput.type = showPassword ? "text" : "password";
    eyeIcon.className = showPassword ? "bi bi-eye-slash" : "bi bi-eye";

    togglePassword.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
    );
});

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    message.classList.add("d-none");
    loginBtn.disabled = true;
    loginBtn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: passwordInput.value,
                expectedRole: "admin"
            })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.message || data.error || "Login failed. Please check your credentials."
            );
        }

        const user = data.user || data.admin;

        if (!user || user.role !== "admin" || !data.token) {
            throw new Error("Admin account not found or access denied.");
        }

        localStorage.setItem("loggedInUser", JSON.stringify(user));
        localStorage.setItem("authToken", data.token);

        showMessage("Login successful! Redirecting...", "success");

        window.location.href = "/admin-dashboard.html";

    } catch (error) {
        showMessage(
            error.message || "Unable to log in. Please try again.",
            "danger"
        );
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML =
            '<i class="bi bi-box-arrow-in-right me-2"></i>Login as Admin';
    }
});
</script>

</body>
</html>
