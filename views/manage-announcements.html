<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Announcements - ClubConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .page-title {
            font-weight: 700;
        }

        .announcement-card {
            border: none;
            border-radius: 15px;
            transition: 0.2s;
        }

        .announcement-card:hover {
            transform: translateY(-3px);
        }

        .announcement-date {
            font-size: 14px;
        }

        .announcement-message {
            white-space: pre-line;
            min-height: 60px;
        }

    </style>

</head>

<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/admin-dashboard.html">

            ClubConnect Admin

        </a>

        <button
            class="btn btn-outline-light"
            onclick="goDashboard()">

            Dashboard

        </button>

    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="container py-4">


    <div
        class="d-flex
               justify-content-between
               align-items-center
               flex-wrap
               gap-2
               mb-4">


        <div>

            <h2 class="page-title mb-1">
                Manage Announcements
            </h2>

            <p class="text-muted mb-0">
                Create and manage college club announcements.
            </p>

        </div>


        <div class="d-flex gap-2">

            <button
                class="btn btn-success"
                onclick="exportAnnouncements()">

                📊 Export Excel

            </button>


            <button
                class="btn btn-primary"
                onclick="openAddModal()">

                + Add Announcement

            </button>

        </div>

    </div>


    <!-- ALERT -->

    <div
        id="alertBox"
        class="alert d-none">
    </div>


    <!-- ANNOUNCEMENTS -->

    <div
        id="announcementContainer"
        class="row g-4">

    </div>

</div>


<!-- =====================================================
     ADD / EDIT MODAL
===================================================== -->

<div
    class="modal fade"
    id="announcementModal"
    tabindex="-1">


    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Add Announcement

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <form id="announcementForm">


                    <input
                        type="hidden"
                        id="announcementId">


                    <!-- TITLE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Announcement Title
                        </label>

                        <input
                            type="text"
                            id="announcementTitle"
                            class="form-control"
                            placeholder="Enter announcement title"
                            required>

                    </div>


                    <!-- CLUB -->

                    <div class="mb-3">

                        <label class="form-label">
                            Club
                        </label>

                        <select
                            id="announcementClub"
                            class="form-select"
                            required>

                            <option value="">
                                Select Club
                            </option>

                        </select>

                    </div>


                    <!-- DATE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            id="announcementDate"
                            class="form-control"
                            required>

                    </div>


                    <!-- MESSAGE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Announcement Message
                        </label>

                        <textarea
                            id="announcementMessage"
                            class="form-control"
                            rows="5"
                            placeholder="Enter announcement message"
                            required>
                        </textarea>

                    </div>


                </form>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="saveAnnouncement()">

                    Save Announcement

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     DELETE MODAL
===================================================== -->

<div
    class="modal fade"
    id="deleteModal"
    tabindex="-1">


    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    Delete Announcement
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <p>
                    Are you sure you want to delete this announcement?
                </p>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="confirmDelete()">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>


// =====================================================
// VARIABLES
// =====================================================

let announcements = [];

let clubs = [];

let selectedDeleteId = null;

let announcementModal;

let deleteModal;


// =====================================================
// PAGE LOAD
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        announcementModal =
            new bootstrap.Modal(
                document.getElementById(
                    "announcementModal"
                )
            );


        deleteModal =
            new bootstrap.Modal(
                document.getElementById(
                    "deleteModal"
                )
            );


        await loadClubs();

        await loadAnnouncements();

    }
);


// =====================================================
// LOAD CLUBS
// =====================================================

async function loadClubs() {

    try {

        const response =
            await fetch(
                "/api/clubs"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load clubs."
            );

        }


        clubs =
            data.clubs || [];


        populateClubDropdown();

    }

    catch (error) {

        showAlert(
            error.message,
            "danger"
        );

    }

}


// =====================================================
// POPULATE CLUB DROPDOWN
// =====================================================

function populateClubDropdown(
    selectedValue = ""
) {

    const select =
        document.getElementById(
            "announcementClub"
        );


    select.innerHTML = `

        <option value="">
            Select Club
        </option>

        ${clubs.map(club => `

            <option
                value="${escapeHtml(club.name)}"
                ${club.name === selectedValue
                    ? "selected"
                    : ""}>

                ${escapeHtml(club.name)}

            </option>

        `).join("")}

    `;

}


// =====================================================
// LOAD ANNOUNCEMENTS
// =====================================================

async function loadAnnouncements() {

    const container =
        document.getElementById(
            "announcementContainer"
        );


    container.innerHTML = `

        <div class="col-12 text-center py-5">

            <div
                class="spinner-border text-primary">
            </div>

            <p class="text-muted mt-2">
                Loading announcements...
            </p>

        </div>

    `;


    try {

        const response =
            await fetch(
                "/api/announcements"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load announcements."
            );

        }


        announcements =
            data.announcements || [];


        renderAnnouncements();

    }

    catch (error) {

        showAlert(
            error.message,
            "danger"
        );

        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-danger">

                    ${escapeHtml(error.message)}

                </div>

            </div>

        `;

    }

}


// =====================================================
// RENDER ANNOUNCEMENTS
// =====================================================

function renderAnnouncements() {

    const container =
        document.getElementById(
            "announcementContainer"
        );


    if (announcements.length === 0) {

        container.innerHTML = `

            <div class="col-12">

                <div class="card shadow-sm p-5 text-center">

                    <h4>
                        No Announcements Found
                    </h4>

                    <p class="text-muted mb-0">

                        Click "Add Announcement"
                        to create one.

                    </p>

                </div>

            </div>

        `;

        return;

    }


    container.innerHTML =
        announcements.map(
            announcement => {


                const date =
                    announcement.date
                        ? new Date(
                            announcement.date
                        ).toLocaleDateString(
                            "en-IN",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric"
                            }
                        )
                        : "";


                return `

                    <div class="col-md-6 col-lg-4">

                        <div
                            class="card
                                   announcement-card
                                   shadow-sm
                                   h-100">


                            <div class="card-body d-flex flex-column">


                                <div
                                    class="d-flex
                                           justify-content-between
                                           align-items-start
                                           gap-2
                                           mb-2">


                                    <h5 class="fw-bold">

                                        ${escapeHtml(
                                            announcement.title
                                        )}

                                    </h5>


                                    <span
                                        class="badge bg-primary">

                                        ${escapeHtml(
                                            announcement.clubName
                                        )}

                                    </span>

                                </div>


                                <p
                                    class="text-muted
                                           announcement-date
                                           mb-3">

                                    📅 ${date}

                                </p>


                                <p
                                    class="announcement-message">

                                    ${escapeHtml(
                                        announcement.message
                                    )}

                                </p>


                                <div
                                    class="mt-auto
                                           d-flex
                                           gap-2">


                                    <button
                                        class="btn
                                               btn-outline-primary
                                               btn-sm
                                               flex-fill"
                                        onclick="openEditModal('${announcement._id}')">

                                        Edit

                                    </button>


                                    <button
                                        class="btn
                                               btn-outline-danger
                                               btn-sm
                                               flex-fill"
                                        onclick="openDeleteModal('${announcement._id}')">

                                        Delete

                                    </button>


                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


// =====================================================
// OPEN ADD MODAL
// =====================================================

function openAddModal() {

    document
        .getElementById(
            "announcementForm"
        )
        .reset();


    document
        .getElementById(
            "announcementId"
        )
        .value = "";


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "Add Announcement";


    populateClubDropdown();


    announcementModal.show();

}


// =====================================================
// OPEN EDIT MODAL
// =====================================================

function openEditModal(id) {

    const announcement =
        announcements.find(
            item =>
                item._id === id
        );


    if (!announcement) {

        showAlert(
            "Announcement not found.",
            "danger"
        );

        return;

    }


    document
        .getElementById(
            "announcementId"
        )
        .value =
        announcement._id;


    document
        .getElementById(
            "announcementTitle"
        )
        .value =
        announcement.title;


    populateClubDropdown(
        announcement.clubName
    );


    document
        .getElementById(
            "announcementDate"
        )
        .value =
        formatDateForInput(
            announcement.date
        );


    document
        .getElementById(
            "announcementMessage"
        )
        .value =
        announcement.message;


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "Edit Announcement";


    announcementModal.show();

}


// =====================================================
// SAVE ANNOUNCEMENT
// =====================================================

async function saveAnnouncement() {

    const id =
        document.getElementById(
            "announcementId"
        ).value;


    const title =
        document.getElementById(
            "announcementTitle"
        ).value.trim();


    const clubName =
        document.getElementById(
            "announcementClub"
        ).value;


    const date =
        document.getElementById(
            "announcementDate"
        ).value;


    const message =
        document.getElementById(
            "announcementMessage"
        ).value.trim();


    if (
        !title ||
        !clubName ||
        !date ||
        !message
    ) {

        showAlert(
            "Please fill all required fields.",
            "warning"
        );

        return;

    }


    const payload = {

        title,

        clubName,

        date,

        message

    };


    try {

        const response =
            await fetch(

                id
                    ? `/api/announcements/${id}`
                    : "/api/announcements",

                {

                    method:
                        id
                            ? "PUT"
                            : "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to save announcement."
            );

        }


        announcementModal.hide();


        showAlert(
            data.message ||
            "Announcement saved successfully!",
            "success"
        );


        await loadAnnouncements();

    }

    catch (error) {

        showAlert(
            error.message,
            "danger"
        );

    }

}


// =====================================================
// OPEN DELETE MODAL
// =====================================================

function openDeleteModal(id) {

    selectedDeleteId = id;

    deleteModal.show();

}


// =====================================================
// CONFIRM DELETE
// =====================================================

async function confirmDelete() {

    if (!selectedDeleteId) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/announcements/${selectedDeleteId}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to delete announcement."
            );

        }


        deleteModal.hide();


        selectedDeleteId = null;


        showAlert(
            data.message ||
            "Announcement deleted successfully!",
            "success"
        );


        await loadAnnouncements();

    }

    catch (error) {

        showAlert(
            error.message,
            "danger"
        );

    }

}


// =====================================================
// EXPORT
// =====================================================

function exportAnnouncements() {

    window.location.href =
        "/api/export/announcements";

}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDateForInput(
    date
) {

    if (!date) {

        return "";

    }


    const d =
        new Date(date);


    const year =
        d.getFullYear();


    const month =
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;

}


// =====================================================
// ALERT
// =====================================================

function showAlert(
    message,
    type
) {

    const alertBox =
        document.getElementById(
            "alertBox"
        );


    alertBox.className =
        `alert alert-${type}`;


    alertBox.textContent =
        message;


    alertBox.classList.remove(
        "d-none"
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });


    setTimeout(
        () => {

            alertBox.classList.add(
                "d-none"
            );

        },
        4000
    );

}


// =====================================================
// DASHBOARD
// =====================================================

function goDashboard() {

    window.location.href =
        "/admin-dashboard.html";

}


// =====================================================
// SECURITY
// =====================================================

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function (char) {

                const entities = {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"

                };

                return entities[char];

            }
        );

}

</script>

</body>

</html>
