<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Announcements - ClubConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

    <style>
        body {
            background: #f4f7fc;
            color: #202b3c;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0d1b3d !important;
            padding: 14px 0;
        }

        .navbar-brand {
            color: white !important;
            font-size: 23px;
            font-weight: 800;
        }

        .navbar .nav-link {
            color: #e8efff !important;
            font-weight: 600;
        }

        .navbar .nav-link:hover {
            color: #9fc5ff !important;
        }

        .page-header {
            background: linear-gradient(120deg, #0d1b3d, #174ea6);
            padding: 36px 0;
            color: white;
        }

        .page-header h1 {
            color: white;
            font-weight: 800;
        }

        .page-header p {
            color: #e4edff;
        }

        .panel {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 5px 18px rgba(13, 27, 61, .05);
        }

        h2 {
            color: #0d1b3d;
            font-weight: 750;
        }

        .form-control,
        .form-select {
            min-height: 44px;
            border-radius: 8px;
        }

        .btn {
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-primary {
            background: #174ea6 !important;
            border-color: #174ea6 !important;
        }

        .announcement-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
        }

        footer {
            background: #0d1b3d;
            color: white;
            padding: 20px 0;
            margin-top: 35px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="/index.html">
            <i class="bi bi-people-fill me-2"></i>ClubConnect
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navMenu"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" href="/index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/clubs.html">Clubs</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/events.html">Events</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin-dashboard.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <button id="logoutBtn"
                            class="btn btn-outline-light btn-sm ms-lg-2 mt-2 mt-lg-0">
                        Logout
                    </button>
                </li>

            </ul>
        </div>
    </div>
</nav>

<header class="page-header">
    <div class="container">
        <h1 class="h2">Manage Announcements</h1>
        <p class="mb-0">
            Publish important updates and information for students.
        </p>
    </div>
</header>

<main class="container py-4">

    <div id="message" class="alert d-none" role="alert"></div>

    <section class="panel mb-4">

        <h2 class="h4 mb-3" id="formTitle">Create Announcement</h2>

        <form id="announcementForm">
            <input type="hidden" id="announcementId">

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="title" class="form-label">
                        Announcement Title *
                    </label>

                    <input id="title"
                           class="form-control"
                           maxlength="150"
                           required
                           placeholder="Enter title">
                </div>

                <div class="col-md-6">
                    <label for="audience" class="form-label">Audience</label>

                    <select id="audience" class="form-select">
                        <option value="All">All Students</option>
                        <option value="Students">Students</option>
                        <option value="Club Members">Club Members</option>
                        <option value="Admins">Admins</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="description" class="form-label">
                        Announcement Message *
                    </label>

                    <textarea id="description"
                              class="form-control"
                              rows="5"
                              maxlength="5000"
                              required
                              placeholder="Write your announcement..."></textarea>
                </div>

                <div class="col-12 d-flex flex-wrap gap-2">

                    <button type="submit"
                            class="btn btn-primary"
                            id="saveBtn">

                        <i class="bi bi-megaphone me-1"></i>
                        Publish Announcement
                    </button>

                    <button type="button"
                            class="btn btn-outline-secondary d-none"
                            id="cancelBtn">
                        Cancel Edit
                    </button>

                </div>

            </div>
        </form>
    </section>

    <section class="panel">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">

            <h2 class="h4 mb-0">Published Announcements</h2>

            <div class="d-flex flex-wrap gap-2">

                <input id="searchInput"
                       type="search"
                       class="form-control"
                       style="max-width:260px"
                       placeholder="Search announcements...">

                <button type="button"
                        id="refreshBtn"
                        class="btn btn-outline-primary">

                    <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                </button>

            </div>
        </div>

        <div id="announcementsList">
            <p class="text-muted">Loading announcements...</p>
        </div>

    </section>
</main>

<footer class="text-center">
    <div class="container">
        <small>&copy; 2026 ClubConnect. All Rights Reserved.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
"use strict";

const token =
    localStorage.getItem("authToken") ||
    localStorage.getItem("token") ||
    localStorage.getItem("accessToken");

const form = document.getElementById("announcementForm");
const list = document.getElementById("announcementsList");
const message = document.getElementById("message");

let announcements = [];

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function showMessage(text, type = "danger") {
    message.textContent = text;
    message.className = "alert alert-" + type;
}

function headers(json = true) {
    const result = {
        Authorization: "Bearer " + token
    };

    if (json) {
        result["Content-Type"] = "application/json";
    }

    return result;
}

async function apiRequest(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json().catch(() => ({}));

    if (response.status === 401 || response.status === 403) {
        throw new Error(
            data.message || "Your session expired or access was denied."
        );
    }

    if (!response.ok) {
        throw new Error(data.message || "Request failed.");
    }

    return data;
}

function resetForm() {
    form.reset();

    document.getElementById("announcementId").value = "";
    document.getElementById("formTitle").textContent = "Create Announcement";

    document.getElementById("saveBtn").innerHTML =
        '<i class="bi bi-megaphone me-1"></i>Publish Announcement';

    document.getElementById("cancelBtn").classList.add("d-none");
}

function renderAnnouncements() {
    const query = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    const filtered = announcements.filter(item =>
        [
            item.title,
            item.message,
            item.description,
            item.audience
        ].join(" ").toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
        list.innerHTML =
            '<p class="text-muted mb-0">No announcements found.</p>';
        return;
    }

    list.innerHTML = filtered.map(item => {
        const id = item._id || item.id;
        const title = item.title || "Announcement";
        const content = item.message || item.description || "";
        const audience = item.audience || "All";
        const dateValue = item.createdAt || item.date;

        let date = "";

        if (dateValue) {
            const parsedDate = new Date(dateValue);

            if (!Number.isNaN(parsedDate.getTime())) {
                date = parsedDate.toLocaleDateString("en-IN");
            }
        }

        return `
            <article class="announcement-card">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">

                    <div class="flex-grow-1">
                        <h3 class="h5 mb-2">
                            ${escapeHTML(title)}
                        </h3>

                        <p class="mb-2" style="white-space:pre-line">${escapeHTML(content)}</p>

                        <small class="text-muted">
                            Audience: ${escapeHTML(audience)}
                            ${date ? " · " + escapeHTML(date) : ""}
                        </small>
                    </div>

                    <div class="d-flex gap-2">
                        <button
                            class="btn btn-sm btn-outline-primary"
                            data-action="edit"
                            data-id="${escapeHTML(id)}">
                            Edit
                        </button>

                        <button
                            class="btn btn-sm btn-outline-danger"
                            data-action="delete"
                            data-id="${escapeHTML(id)}">
                            Delete
                        </button>
                    </div>

                </div>
            </article>
        `;
    }).join("");
}

async function loadAnnouncements() {
    list.innerHTML =
        '<p class="text-muted">Loading announcements...</p>';

    try {
        const data = await apiRequest("/api/announcements", {
            method: "GET",
            headers: headers(false)
        });

        announcements = Array.isArray(data)
            ? data
            : (data.announcements || data.data || []);

        if (!Array.isArray(announcements)) {
            announcements = [];
        }

        renderAnnouncements();
        message.classList.add("d-none");

    } catch (error) {
        console.error("Load announcements error:", error);

        list.innerHTML =
            '<p class="text-danger">Unable to load announcements. Please check the server.</p>';

        showMessage(
            error.message || "Unable to load announcements."
        );
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const id = document.getElementById("announcementId").value.trim();
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("description").value.trim();
    const audience = document.getElementById("audience").value;

    if (!title || !description) {
        showMessage("Please enter announcement title and message.");
        return;
    }

    const payload = {
        title,
        message: description,
        description,
        audience
    };

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;

    try {
        const url = id
            ? `/api/announcements/${encodeURIComponent(id)}`
            : "/api/announcements";

        const data = await apiRequest(url, {
            method: id ? "PUT" : "POST",
            headers: headers(),
            body: JSON.stringify(payload)
        });

        showMessage(
            data.message ||
            (id
                ? "Announcement updated successfully."
                : "Announcement published successfully."),
            "success"
        );

        resetForm();
        await loadAnnouncements();

    } catch (error) {
        console.error("Announcement error:", error);

        showMessage(
            error.message || "Unable to save announcement."
        );

    } finally {
        saveBtn.disabled = false;
    }
});

list.addEventListener("click", async function(event) {
    const button = event.target.closest("button[data-action]");

    if (!button) return;

    const id = button.dataset.id;

    const item = announcements.find(value =>
        String(value._id || value.id) === id
    );

    if (!item) {
        showMessage("Announcement not found. Please refresh the list.");
        return;
    }

    if (button.dataset.action === "edit") {
        document.getElementById("announcementId").value =
            item._id || item.id;

        document.getElementById("title").value =
            item.title || "";

        document.getElementById("description").value =
            item.message || item.description || "";

        document.getElementById("audience").value =
            item.audience || "All";

        document.getElementById("formTitle").textContent =
            "Edit Announcement";

        document.getElementById("saveBtn").innerHTML =
            '<i class="bi bi-check-circle me-1"></i>Update Announcement';

        document.getElementById("cancelBtn").classList.remove("d-none");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        return;
    }

    if (button.dataset.action === "delete") {
        if (!confirm("Delete this announcement? This action cannot be undone.")) {
            return;
        }

        button.disabled = true;

        try {
            const data = await apiRequest(
                `/api/announcements/${encodeURIComponent(id)}`,
                {
                    method: "DELETE",
                    headers: headers(false)
                }
            );

            showMessage(
                data.message || "Announcement deleted successfully.",
                "success"
            );

            if (
                document.getElementById("announcementId").value === id
            ) {
                resetForm();
            }

            await loadAnnouncements();

        } catch (error) {
            console.error("Delete announcement error:", error);

            showMessage(
                error.message || "Unable to delete announcement."
            );

            button.disabled = false;
        }
    }
});

document.getElementById("cancelBtn")
    .addEventListener("click", resetForm);

document.getElementById("searchInput")
    .addEventListener("input", renderAnnouncements);

document.getElementById("refreshBtn")
    .addEventListener("click", loadAnnouncements);

document.getElementById("logoutBtn").addEventListener("click", function() {
    [
        "authToken",
        "token",
        "accessToken",
        "loggedInUser",
        "user",
        "currentUser"
    ].forEach(key => localStorage.removeItem(key));

    window.location.replace("/index.html");
});

function checkAdminAccess() {
    let user;

    try {
        user = JSON.parse(
            localStorage.getItem("loggedInUser") || "null"
        );
    } catch (error) {
        user = null;
    }

    if (!token || !user || user.role !== "admin") {
        window.location.replace("/admin-login.html");
        return false;
    }

    return true;
}

if (checkAdminAccess()) {
    loadAnnouncements();
}
</script>

</body>
</html>
