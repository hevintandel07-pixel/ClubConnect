<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ClubConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../public/css/style.css">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            ClubConnect
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="clubs.html">
                        Clubs
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="events.html">
                        Events
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="login.html">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="register.html">
                        Register
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- Login Section -->
<section class="container login-container">

    <h2 class="text-center mb-4">
        ClubConnect Login
    </h2>

    <form id="loginForm">

        <!-- Email -->
        <div class="mb-3">

            <label for="email" class="form-label">
                Email
            </label>

            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

        </div>


        <!-- Password -->
        <div class="mb-3">

            <label for="password" class="form-label">
                Password
            </label>

            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>

        </div>


        <!-- Login Button -->
        <div class="d-grid">

            <button type="submit"
                    id="loginButton"
                    class="btn btn-primary">

                Login

            </button>

        </div>

    </form>


    <!-- Register Link -->
    <p class="text-center mt-3 mb-0">

        Don't have an account?

        <a href="register.html">
            Register Here
        </a>

    </p>

</section>


<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">

    <p class="mb-1">
        ClubConnect - College Club Management System
    </p>

    <p class="mb-0">
        &copy; 2026 ClubConnect. All Rights Reserved.
    </p>

</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script>

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");

loginForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        alert("Please enter email and password.");
        return;

    }


    loginButton.disabled = true;
    loginButton.innerText = "Logging in...";


    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                email: email,
                password: password

            })

        });


        const data = await response.json();


        if (response.ok) {

            /*
             * Clear old login information
             * before saving the new user.
             */
            localStorage.removeItem("loggedInUser");
            localStorage.removeItem("user");
            localStorage.removeItem("currentUser");
            localStorage.removeItem("student");


            /*
             * Save logged-in user.
             */
            if (data.user) {

                localStorage.setItem(
                    "loggedInUser",
                    JSON.stringify(data.user)
                );

                /*
                 * Keep multiple keys for compatibility
                 * with existing ClubConnect pages.
                 */
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(data.user)
                );

                localStorage.setItem(
                    "student",
                    JSON.stringify(data.user)
                );

            }


            alert(data.message || "Login successful!");


            /*
             * Admin → Admin Dashboard
             * Student → Student Dashboard
             */
            if (
                data.user &&
                data.user.role &&
                data.user.role.toLowerCase() === "admin"
            ) {

                window.location.href =
                    "admin-dashboard.html";

            } else {

                window.location.href =
                    "student-dashboard.html";

            }


        } else {

            alert(
                data.message ||
                "Invalid email or password."
            );

        }

    } catch (error) {

        console.error(
            "Login Error:",
            error
        );

        alert(
            "Unable to connect to server. Please try again."
        );

    } finally {

        loginButton.disabled = false;
        loginButton.innerText = "Login";

    }

});

</script>

</body>

</html>
