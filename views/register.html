<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - ClubConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../public/css/style.css">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            ClubConnect
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="clubs.html">
                        Clubs
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="events.html">
                        Events
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="register.html">
                        Register
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- Registration Section -->
<section class="container login-container">

    <h2 class="text-center mb-4">
        Student Registration
    </h2>

    <form id="registerForm">

        <!-- Name -->
        <div class="mb-3">

            <label for="name" class="form-label">
                Full Name
            </label>

            <input type="text"
                   class="form-control"
                   id="name"
                   placeholder="Enter your full name"
                   required>

        </div>


        <!-- Enrollment -->
        <div class="mb-3">

            <label for="enrollment" class="form-label">
                Enrollment Number
            </label>

            <input type="text"
                   class="form-control"
                   id="enrollment"
                   placeholder="Enter enrollment number"
                   required>

        </div>


        <!-- Email -->
        <div class="mb-3">

            <label for="email" class="form-label">
                Email
            </label>

            <input type="email"
                   class="form-control"
                   id="email"
                   placeholder="Enter your email"
                   required>

        </div>


        <!-- Department -->
        <div class="mb-3">

            <label for="department" class="form-label">
                Department
            </label>

            <select class="form-select"
                    id="department"
                    required>

                <option value="">
                    Select Department
                </option>

                <option value="Computer Engineering">
                    Computer Engineering
                </option>

                <option value="Information Technology">
                    Information Technology
                </option>

                <option value="Electronics Engineering">
                    Electronics Engineering
                </option>

                <option value="Electrical Engineering">
                    Electrical Engineering
                </option>

                <option value="Mechanical Engineering">
                    Mechanical Engineering
                </option>

                <option value="Civil Engineering">
                    Civil Engineering
                </option>

            </select>

        </div>


        <!-- Semester -->
        <div class="mb-3">

            <label for="semester" class="form-label">
                Semester
            </label>

            <select class="form-select"
                    id="semester"
                    required>

                <option value="">
                    Select Semester
                </option>

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>

            </select>

        </div>


        <!-- Password -->
        <div class="mb-3">

            <label for="password" class="form-label">
                Password
            </label>

            <input type="password"
                   class="form-control"
                   id="password"
                   placeholder="Create password"
                   minlength="6"
                   required>

            <small class="text-muted">
                Password must contain at least 6 characters.
            </small>

        </div>


        <!-- Confirm Password -->
        <div class="mb-3">

            <label for="confirmPassword" class="form-label">
                Confirm Password
            </label>

            <input type="password"
                   class="form-control"
                   id="confirmPassword"
                   placeholder="Confirm password"
                   minlength="6"
                   required>

        </div>


        <!-- Register Button -->
        <div class="d-grid">

            <button type="submit"
                    id="registerButton"
                    class="btn btn-primary">

                Register

            </button>

        </div>

    </form>


    <!-- Login Link -->
    <p class="text-center mt-3 mb-0">

        Already have an account?

        <a href="login.html">
            Login Here
        </a>

    </p>

</section>


<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">

    <p class="mb-1">
        ClubConnect - College Club Management System
    </p>

    <p class="mb-0">
        &copy; 2026 ClubConnect. All Rights Reserved.
    </p>

</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script>

const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.getElementById("registerButton");


registerForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const enrollment =
            document.getElementById("enrollment").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const department =
            document.getElementById("department").value;

        const semester =
            document.getElementById("semester").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        // Check password
        if (password !== confirmPassword) {

            alert("Passwords do not match.");
            return;

        }


        // Check password length
        if (password.length < 6) {

            alert(
                "Password must contain at least 6 characters."
            );

            return;

        }


        registerButton.disabled = true;
        registerButton.innerText = "Registering...";


        try {

            const response = await fetch(
                "/api/register",
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name: name,
                        enrollment: enrollment,
                        email: email,
                        department: department,
                        semester: Number(semester),
                        password: password

                    })

                }
            );


            const data =
                await response.json();


            if (response.ok) {

                alert(
                    data.message ||
                    "Registration successful!"
                );


                // Clear old login information
                localStorage.removeItem(
                    "loggedInUser"
                );

                localStorage.removeItem("user");

                localStorage.removeItem(
                    "currentUser"
                );

                localStorage.removeItem(
                    "student"
                );


                // Redirect to login
                window.location.href =
                    "login.html";


            } else {

                alert(
                    data.message ||
                    "Registration failed."
                );

            }


        } catch (error) {

            console.error(
                "Registration Error:",
                error
            );

            alert(
                "Unable to connect to server. Please try again."
            );

        } finally {

            registerButton.disabled = false;
            registerButton.innerText = "Register";

        }

    }
);

</script>

</body>

</html>
